<title>grcwa Plate Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#f2f6fa; --surface:#ffffff; --surface-2:#e9f0f6; --plate:#ffffff;
  --ink:#0f1a24; --ink-2:#38495a; --muted:#69798a; --line:#d7e1ea; --line-2:#c2d0dc;
  --si:#31456b; --au:#a8790c; --beam:#c8431f; --ok:#1b7d51;
  --shadow:0 1px 2px rgba(15,26,36,.06),0 8px 26px -14px rgba(15,26,36,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0c1218; --surface:#131b23; --surface-2:#1a242e; --plate:#f6f8fa;
    --ink:#e9eff5; --ink-2:#b6c5d1; --muted:#8496a5; --line:#243039; --line-2:#31414e;
    --si:#93aada; --au:#e2af3e; --beam:#f0764f; --ok:#4ec792;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0c1218; --surface:#131b23; --surface-2:#1a242e; --plate:#f6f8fa;
  --ink:#e9eff5; --ink-2:#b6c5d1; --muted:#8496a5; --line:#243039; --line-2:#31414e;
  --si:#93aada; --au:#e2af3e; --beam:#f0764f; --ok:#4ec792;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62; letter-spacing:.005em;
}
.wrap{max-width:1240px;margin:0 auto;padding:0 28px}
.measure{max-width:70ch}
h1,h2,h3{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  font-weight:700;text-wrap:balance;margin:0;letter-spacing:-.012em}
h1{font-size:clamp(2.1rem,5vw,3.15rem);line-height:1.04}
h2{font-size:clamp(1.5rem,3vw,2.05rem);line-height:1.1}
h3{font-size:1.16rem;line-height:1.25;font-weight:600}
p{margin:0 0 1em}
a{color:var(--beam)}
code,.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
code{font-size:.875em;background:var(--surface-2);padding:.1em .36em;border-radius:3px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:.72rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);font-weight:500}

/* ---- masthead ---- */
header.top{border-bottom:1px solid var(--line);background:var(--surface)}
.mast{padding:44px 0 36px;display:grid;gap:22px;
  grid-template-columns:minmax(0,1.25fr) minmax(0,.85fr);align-items:end}
.mast .eyebrow,.mast h1{grid-column:1/-1}
.mast .side{display:grid;gap:16px;padding-bottom:4px;border-left:1px solid var(--line);
  padding-left:24px}
@media (max-width:900px){.mast{grid-template-columns:1fr}
  .mast .side{border-left:none;padding-left:0;border-top:1px solid var(--line);padding-top:18px}}
.mast .deck{font-size:1.075rem;color:var(--ink-2);max-width:64ch}
.rule-row{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:baseline;
  font-family:"IBM Plex Mono",monospace;font-size:.78rem;color:var(--muted)}
.rule-row b{color:var(--ink);font-weight:500}

/* ---- section ---- */
section{padding:56px 0 8px}
.sec-head{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;
  padding-bottom:22px;margin-bottom:30px;border-bottom:2px solid var(--ink)}
.sec-head .lede{color:var(--ink-2);max-width:74ch;margin:0}

/* ---- plate ---- */
.plate{background:var(--surface);border:1px solid var(--line);border-radius:2px;
  margin:0 0 34px;box-shadow:var(--shadow);overflow:hidden}
.plate-head{display:grid;grid-template-columns:88px minmax(0,1fr);gap:20px;
  padding:22px 24px 18px;border-bottom:1px solid var(--line)}
.plate-id{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:1.5rem;
  color:var(--beam);line-height:1;padding-top:2px}
.plate-id small{display:block;font-size:.62rem;letter-spacing:.14em;color:var(--muted);
  font-weight:500;margin-top:8px;text-transform:uppercase}
.plate-head h3{margin-bottom:6px}
.plate-head p{margin:0;color:var(--ink-2);font-size:.95rem;max-width:76ch}
.frame{background:var(--plate);padding:14px;border-bottom:1px solid var(--line);
  overflow-x:auto}
.frame img{display:block;width:100%;height:auto;cursor:zoom-in;min-width:720px}
.zoomhint{font-family:"IBM Plex Mono",monospace;font-size:.68rem;color:var(--muted);
  padding:8px 24px 0;letter-spacing:.05em}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:1px;background:var(--line)}
.spec{background:var(--surface);padding:16px 24px 18px}
.spec .k{font-family:"IBM Plex Mono",monospace;font-size:.68rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.spec .v{font-size:.92rem;color:var(--ink-2);line-height:1.5}
.spec.good .k{color:var(--ok)}
.spec.cost .k{color:var(--au)}

/* ---- callout ---- */
.callout{border-left:3px solid var(--beam);background:var(--surface);
  padding:20px 24px;margin:0 0 34px;border-top:1px solid var(--line);
  border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.callout h3{margin-bottom:8px}
.callout p:last-child{margin-bottom:0}
.callout ul{margin:.5em 0 0;padding-left:1.15em}
.callout li{margin-bottom:.35em;color:var(--ink-2)}
.callout li b{color:var(--ink);font-weight:600}

/* ---- explorer ---- */
.explorer{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
  border-radius:2px;overflow:hidden;margin-bottom:34px}
.ctrls{display:grid;gap:14px;padding:20px 24px;border-bottom:1px solid var(--line);
  background:var(--surface-2)}
.ctrl-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctrl-row .lbl{font-family:"IBM Plex Mono",monospace;font-size:.68rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);min-width:88px}
button.chip{font-family:"IBM Plex Mono",monospace;font-size:.76rem;padding:5px 11px;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);
  border-radius:2px;cursor:pointer;transition:background .13s,color .13s,border-color .13s}
button.chip:hover{border-color:var(--ink-2)}
button.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);
  border-color:var(--ink)}
button.chip:focus-visible{outline:2px solid var(--beam);outline-offset:2px}
button.serie{display:inline-flex;align-items:center;gap:7px}
button.serie .sw{width:16px;height:3px;border-radius:2px;flex:0 0 auto}
button.serie[aria-pressed="false"]{opacity:.42}
.canvas-wrap{position:relative;background:var(--surface);padding:8px 4px 4px}
canvas{display:block;width:100%;height:auto;touch-action:none}
.readout{font-family:"IBM Plex Mono",monospace;font-size:.74rem;color:var(--ink-2);
  padding:10px 24px 16px;border-top:1px solid var(--line);min-height:2.9em;
  white-space:pre-wrap;background:var(--surface)}
.casebar{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;
  flex-wrap:wrap;gap:6px;background:var(--surface)}

/* ---- table ---- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);background:var(--surface);
  box-shadow:var(--shadow);margin-bottom:34px}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:560px}
th,td{text-align:left;padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:"IBM Plex Mono",monospace;font-size:.68rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--surface-2)}
td.mono{font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}

/* ---- lightbox ---- */
.lb{position:fixed;inset:0;background:rgba(8,12,16,.94);z-index:99;display:none;
  overflow:auto;padding:0;cursor:zoom-out}
.lb.on{display:block}
.lb img{display:block;max-width:none;margin:0 auto}
.lb .close{position:fixed;top:14px;right:18px;font-family:"IBM Plex Mono",monospace;
  font-size:.8rem;color:#e9eff5;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);
  padding:7px 13px;border-radius:2px;cursor:pointer}
footer{border-top:1px solid var(--line);margin-top:56px;padding:26px 0 44px;
  color:var(--muted);font-size:.84rem}
@media (max-width:760px){
  .wrap{padding:0 18px}
  .plate-head{grid-template-columns:1fr;gap:10px}
  .plate-id{font-size:1.2rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
